{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="content-flash">
      {% for category, message in messages %}
        <div class="flash flash-{{ 'error' if category == 'error' else category }}" role="{{ 'alert' if category == 'error' else 'status' }}">{{ message }}</div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
