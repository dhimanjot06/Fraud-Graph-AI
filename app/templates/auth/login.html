{% extends "public_base.html" %}
{% block title %}Sign in — FraudGraph AI{% endblock %}
{% block extra_head %}<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card panel">
    <h1>Sign in</h1>
    <p class="auth-sub">Continue to your fraud-ring investigations.</p>
    <form method="post" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ email|default('') }}" autocomplete="email" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-signal btn-block">Sign in</button>
    </form>
    <div class="auth-switch">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></div>
  </div>
</div>
{% endblock %}
